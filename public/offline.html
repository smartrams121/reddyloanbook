<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Daily Finance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .container { max-width: 360px; }
  .icon {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    background: #eff6ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 40px; height: 40px; color: #2563eb; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
  .retry {
    display: inline-block;
    padding: 12px 32px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
  }
  .retry:hover { background: #1d4ed8; }
  .brand { margin-top: 40px; font-size: 12px; color: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .icon { background: #1e3a5f; }
    p { color: #94a3b8; }
    .brand { color: #475569; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.008v.008H12v-.008Z"/>
    </svg>
  </div>
  <h1>You are offline</h1>
  <p>Please check your internet connection and try again.</p>
  <button class="retry" onclick="location.reload()">Retry</button>
  <p class="brand">Daily Finance</p>
</div>
</body>
</html>
